[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "gridguard"
version = "1.0.0"
description = "Contingency screening and voltage stability studies"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]
license = "MIT"
authors = [{name = "Victor Odoyo"}]
[project.scripts]
gridguard = "gridguard.cli:main"
[tool.setuptools.packages.find]
include = ["gridguard*"]
[tool.setuptools.package-data]
gridguard = ["web/*", "examples/*.json"]
